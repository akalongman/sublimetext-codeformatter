name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r dev-requirements.pip ruff==0.17.1
      - run: python -m pytest -q -p no:cacheprovider tests --ignore=tests/test_phpformatter_tools.py
        env:
          CODEFORMATTER_TEST_RUFF: ruff
          CODEFORMATTER_REQUIRE_TOOLS: '1'

  ruff-oldest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r dev-requirements.pip ruff==0.1.2
      - run: python -m pytest -q -p no:cacheprovider tests/test_pyformatter_ruff.py
        env:
          CODEFORMATTER_TEST_RUFF: ruff
          CODEFORMATTER_REQUIRE_TOOLS: '1'

  python33:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install vermin==1.9.2
      - run: vermin --target=3.3- --violations --exclude str.decode --no-tips CodeFormatter.py codeformatter
